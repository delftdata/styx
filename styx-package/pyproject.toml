[build-system]
requires = ["setuptools>=61.0", "Cython>=3.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "styx"
version = "0.0.1"
authors = [
    { name = "Kyriakos Psarakis" }
]
requires-python = ">=3.14"
dependencies = [
    # Serialization
    "cloudpickle>=3.1.2,<4.0.0",
    "msgspec>=0.22.0,<1.0.0",
    # Kafka clients (async/sync)
    "aiokafka>=0.14.0,<1.0",
    "confluent-kafka>=2.16.0,<3.0.0",
    # Hashing
    "cityhash>=0.4.10,<1.0.0",
    # Compression
    "zstandard>=0.25.0,<1.0.0",
    # S3
    "boto3>=1.43.114"
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]
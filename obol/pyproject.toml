[project]
name = "obol"
version = "0.4.0"
authors = [
  { name = "Alexandros Dimakos", email = "S.A.Dimakos@student.tudelft.nl" },
  { name = "Jeff Smits", email = "J.Smits-1@tudelft.nl" },
]
description = "Compiler for the Styx embedded DSL in Python"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "libcst>=1.8.6",
    "libcst-dfa>=0.0.1",
    "libcst-mypy>=0.1.0",
    "mypy>=1.19.1",
    "styx",
]

[dependency-groups]
dev = [
  "hatch>=1.13.0",
  "prek>=0.3.6",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "mkdocstrings[python]>=1.0.3",
  "mkdocs-material>=9.7.5",
  "setuptools-scm>=9.2.2",
  "sanic>=25.12.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obol"]

[tool.hatch.build.targets.sdist]
include = ["src/obol", "README.md", "LICENSE", "pyproject.toml"]

[tool.uv]
no-binary-package = ["mypy"]

[tool.uv.sources]
styx = { path = "../styx-package", editable = true }

[project.urls]
Homepage = "https://github.com/AlexDimakos/styx"

[project.scripts]
obol = "obol.core:main"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = [
  "error",
]
log_cli_level = "INFO"
testpaths = [
  "tests",
]

[tool.coverage]
run.source = ["obol"]
port.exclude_lines = [
  'pragma: no cover',
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]

[tool.ruff]
src = ["src"]
exclude = ["examples"]  # compiler inputs / generated output: don't lint or format
line-length = 120  # how long you want lines to be

[tool.ruff.format]
docstring-code-format = true  # code snippets in docstrings will be formatted
exclude = ["*.md"]  # leave hand-formatted code blocks in Markdown docs alone

[tool.ruff.lint]
# For more strict linting and code simplifications, replace this with
# https://github.com/NLeSC/python-template/blob/main/template/pyproject.toml.jinja#L121-L136
select = [
  "E", "F", "W", # flake8
  "B",           # flake8-bugbear
  "I",           # isort
  "ARG",         # flake8-unused-arguments
  "C4",          # flake8-comprehensions
  "EM",          # flake8-errmsg
  "ICN",         # flake8-import-conventions
  "ISC",         # flake8-implicit-str-concat
  "G",           # flake8-logging-format
  "PGH",         # pygrep-hooks
  "PIE",         # flake8-pie
  "PL",          # pylint
  "PT",          # flake8-pytest-style
  "RET",         # flake8-return
  "RUF",         # Ruff-specific
  "SIM",         # flake8-simplify
  "UP",          # pyupgrade
  "YTT",         # flake8-2020
  "EXE",         # flake8-executable
  # "D",           # pydocstyle, uncomment to have the docstrings linted
  # "ANN",         # flake8-annotations, uncomment to have type hint annotations linted
]
ignore = [
  "PLR",    # Design related pylint codes
  "ISC001", # Conflicts with formatter
]
pydocstyle.convention = "google"
exclude = [
  "examples/**.py"
]

[tool.ruff.lint.per-file-ignores]
# Tests can ignore a few extra rules
"tests/**.py" = [
    "ANN201",  # Missing return type annotation for public function
    "D103",    # Missing docstring
    "S101",    # Use of assert is detected
    "INP001",  # Missing __init__.py file
    "PT009",   # unittest-style assertions are idiomatic in a TestCase
    "PLW0603", # module-global Styx client set up in setUpModule
    "EM101",   # exception message string literals are fine in tests
    "EM102",   # f-string exception messages are fine in tests
]
# The demo app uses web-framework handler signatures.
"working-example/**.py" = [
    "ARG001",  # Sanic passes request/app/loop to handlers even when unused
    "INP001",  # standalone scripts, not an importable package
]

[tool.yamlfix]
line_length = 120
sequence_style = "keep_style"
explicit_start = false
whitelines = 1
section_whitelines = 1

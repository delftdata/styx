apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus  # Referenced by the provisioned dashboards
    type: prometheus
    access: proxy
    url: http://prometheus:9090  # Correct Prometheus service inside Docker network
    isDefault: true
    jsonData:
      httpMethod: GET  # Explicitly set the HTTP method to GET
      timeInterval: 5s  # Prometheus scrape interval; sets the minimum step and $__rate_interval
